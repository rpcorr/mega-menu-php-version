<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="160" viewBox="0 0 128 160" role="img" aria-label="FILE file icon">
  <defs>
    <style type="text/css"><![CDATA[
      .file { fill: none; stroke: #333; stroke-width:4; stroke-linejoin:round; }
      .fold { fill: #6c757d; stroke: #333; stroke-width:2; }
      .badge { fill: #6c757d; }
      .ext { font-family: Arial, Helvetica, sans-serif; font-weight:700; font-size:28px; fill: #fff; }
      .small { font-size:14px; fill:#333; font-weight:600; }
    ]]></style>
  </defs>

  <!-- file shape -->
  <path class="file" d="M12 12h70l34 34v102a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8V20a8 8 0 0 1 8-8z"/>
  <!-- folded corner -->
  <path class="fold" d="M82 12v34h34" />
  <!-- badge rectangle (bottom-right) -->
  <rect x="12" y="104" width="104" height="44" rx="6" class="badge"/>
  <!-- extension letters centered in badge -->
