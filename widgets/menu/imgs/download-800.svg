<svg width="50rem" height="3.75rem" viewBox="0 0 800 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1"></stop>
    </linearGradient>
  </defs>
  <!-- Background shape -->
  <rect width="800" height="60" fill="url(#gradLogo)"></rect>

  <!-- Example text/logo placeholder -->
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="28" fill="white" dominant-baseline="middle" text-anchor="middle">
    Your Logo
  </text>
</svg>
