<svg width="1000" height="60" viewBox="0 0 1000 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50; stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#2E7D32; stop-opacity:1"></stop>
    </linearGradient>
  </defs>

  <!-- Background rectangle -->
  <rect width="1000" height="60" fill="url(#logoGradient)"></rect>

  <!-- Placeholder logo text -->
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" dominant-baseline="middle" text-anchor="middle">
    Your Logo
  </text>
</svg>
