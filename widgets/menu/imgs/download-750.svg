<svg width="750" height="60" viewBox="0 0 750 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50; stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#2E7D32; stop-opacity:1"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="750" height="60" fill="url(#logoGradient)"></rect>

  <!-- Example logo text -->
  <text x="50%" y="50%" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" dominant-baseline="middle">
    Your Logo
  </text>
</svg>
